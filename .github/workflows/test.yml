name: test

# Runs the whole suite, Chrome integration tests included, on Linux and on Windows with core.autocrlf=true.
# Security: read-only token, no secrets, no pull_request_target, every action pinned by full commit SHA.
on:
  push:
    branches: ['**']
  pull_request:
  # Starts another run on a commit that already ran: `gh workflow run test.yml --ref <branch>` (docs/release.md, step 6).
  workflow_dispatch:

permissions:
  contents: read

# One run per commit at a time: a push and a pull request for the same commit do not both run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The Chrome phase runs its files one at a time after everything else and takes several minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Convert line endings on checkout (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All history and all tags: the update and migration tests extract the published v0.1.2 and v0.1.3 releases.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # v7.1.0 was released 2026-10-08, nine days before this workflow was written; the SHA was read from the GitHub API.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The floor of package.json "engines".
          node-version: '22.4'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install Python test requirements
        run: pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Point optbrew at the runner's Chrome (Linux)
        if: runner.os == 'Linux'
        # Ubuntu 23.10 and later ship an AppArmor profile for Chrome stable at /opt/google/chrome/chrome that allows the sandbox its
        # user namespaces, so no sysctl change is made here. If a run reports "No usable sandbox", read the AppArmor section of
        # https://pptr.dev/troubleshooting before adding a workaround.
        run: |
          # render.test.mjs skips its cross-origin font test when this system font is missing.
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core; }
          chrome="$(command -v google-chrome-stable || command -v google-chrome || true)"
          test -n "$chrome" || { echo 'Google Chrome is not installed on this runner' >&2; exit 1; }
          echo "OPTBREW_CHROME=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Point optbrew at the runner's Chrome (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome)) { throw 'Google Chrome is not installed on this runner' }
          "OPTBREW_CHROME=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion

      - name: Python tests
        run: python -m unittest discover -s tests/python

      - name: Test
        # The spec reporter prints each skipped test with its reason and the "ℹ skipped N" summary of each phase, which the last step reads.
        run: npm test -- --test-reporter=spec 2>&1 | tee "$RUNNER_TEMP/optbrew-test.log"

      - name: Check that nothing was skipped by accident
        # The Chrome phase must skip nothing. The other files may skip only for the by-design reasons listed in the script.
        run: node scripts/check-skips.mjs "$RUNNER_TEMP/optbrew-test.log"
