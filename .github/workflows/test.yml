name: test

on:
  push:
    branches: ['diag/chrome-temp']

permissions:
  contents: read

jobs:
  diag:
    name: diag chrome temp (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.4'
      - run: npm ci --ignore-scripts
      - name: Chrome and its wrapper
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome)"
          echo "OPTBREW_CHROME=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
          readlink -f "$chrome"
          node -p "require('os').tmpdir()"
          echo "TMPDIR=${TMPDIR:-unset}"
          grep -n -i "tmp\|exec" "$(readlink -f "$chrome")" | head -40
      - name: Diagnose
        run: node scripts/diag-chrome-temp.mjs 20
